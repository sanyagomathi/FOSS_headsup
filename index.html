<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, user-scalable=no"
  />

  <title>Tilt Heads Up</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main class="game-container">
    <section id="start-screen" class="screen">
      <h1>Tilt Heads Up</h1>

      <p>
        Hold the phone against your forehead.
        Tilt down for correct and tilt up to pass.
      </p>

      <button id="start-button">Start Game</button>

      <p id="permission-message"></p>
    </section>

    <section id="game-screen" class="screen hidden">
      <div class="top-bar">
        <span>Score: <strong id="score">0</strong></span>
        <span>Time: <strong id="timer">60</strong></span>
      </div>

      <div id="game-card" class="game-card">
        <h2 id="word">Get Ready!</h2>
        <p id="tilt-status">Keep the phone upright</p>
      </div>

      <button id="correct-button" class="manual-button correct">
        Correct
      </button>

      <button id="pass-button" class="manual-button pass">
        Pass
      </button>
    </section>

    <section id="result-screen" class="screen hidden">
      <h1>Game Over!</h1>

      <p>Your score</p>
      <h2 id="final-score">0</h2>

      <button id="restart-button">Play Again</button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
